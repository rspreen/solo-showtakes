# Local services for development and tests (Postgres and the Mailpit email
# inbox), run with `pnpm services:up`
# (docker compose, served by OrbStack on macOS). Production uses Neon Postgres
# instead (ticket 8), so nothing here is deployed.
#
# Tests do not use the `showtakes` database below: each `pnpm test` run
# creates its own throwaway database on this same server (see
# src/db/testing/global-setup.ts).
name: showtakes

services:
  postgres:
    # Exact version, at least a week old, matching the minimumReleaseAge rule
    # for packages in pnpm-workspace.yaml. Keep in step with the Postgres image
    # in .github/workflows/ci.yml, and with the production major version
    # (Neon, ticket 8). Upgrade deliberately by changing the tag.
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_USER: showtakes
      POSTGRES_PASSWORD: showtakes
      POSTGRES_DB: showtakes
    ports:
      # Host port 5433, not the default 5432, so this can run alongside other
      # projects' Postgres containers. Must match DATABASE_URL in .env.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showtakes -d showtakes"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Local email inbox (ticket 4). Catches every email the app sends in
  # development and tests, and delivers none of them. Read them at
  # http://localhost:8025. The app sends through its HTTP API (see
  # src/mail/mailpit-mailer.ts), and integration tests use the same API to
  # check what arrived.
  mailpit:
    # Exact version, at least a week old, matching the minimumReleaseAge rule
    # for packages in pnpm-workspace.yaml.
    image: axllent/mailpit:v1.31.4
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
