# Continuous integration: runs every check on each push and pull request.
# A red run here means the change must not be deployed (docs/TASKS.md, ticket 1).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres and Mailpit for integration tests, matching compose.yaml (same
    # pinned images and host ports), so the settings below match .env.example.
    # Change image versions in both files together.
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: showtakes
          POSTGRES_PASSWORD: showtakes
          POSTGRES_DB: showtakes
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U showtakes -d showtakes"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 8025:8025
    # Same settings as .env.example.
    env:
      DATABASE_URL: postgres://showtakes:showtakes@localhost:5433/showtakes
      MAIL_PROVIDER: mailpit
      MAIL_FROM: noreply@showtakes.test
      MAILPIT_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      # Node 24 is the current long-term-support release, matching production.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree,
      # so CI installs exactly what was tested locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck

      # Proves the committed migrations apply cleanly to a fresh database.
      - run: pnpm db:migrate

      # Unit and integration tests; integration tests create their own
      # throwaway database on the Postgres service above, and check sent
      # mail in the Mailpit service.
      - run: pnpm test

      # Browser tests run against the production build.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # On failure, keep Playwright's report (screenshots, traces) for debugging.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
