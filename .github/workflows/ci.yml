# Continuous integration: runs every check on each push and pull request.
# A red run here means the change must not be deployed (docs/TASKS.md, ticket 1).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      # Node 24 is the current long-term-support release, matching production.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree,
      # so CI installs exactly what was tested locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Browser tests run against the production build.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # On failure, keep Playwright's report (screenshots, traces) for debugging.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
