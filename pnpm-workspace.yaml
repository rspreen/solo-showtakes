# pnpm settings for this repository.
#
# minimumReleaseAge: pnpm refuses package versions published less than this
# many minutes ago (10080 = 7 days). Most malicious releases of popular
# packages are spotted and pulled within days, so waiting a week is a cheap
# defence against supply-chain attacks. Avoid adding exceptions; wait instead.
minimumReleaseAge: 10080

# Packages allowed to run install scripts. All are disabled for now: sharp
# (image processing) will be enabled by the "Image storage" ticket, which
# resizes images. esbuild (used by drizzle-kit) gets its binary from a
# platform-specific optional dependency, so its install script is not needed.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
